name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: mix precommit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Versions must match mise.toml (elixir 1.20.0-rc.3-otp-28, erlang 28).
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.0-rc.3-otp-28"
          otp-version: "28.4.1"
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # Single quality contract: compile --warning-as-errors, deps.unlock --unused,
      # format, test (`:integration` tests stay excluded via test/test_helper.exs).
      - run: mix precommit
